name: Build Ultra Booster Max APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q UltraBoosterMax_Android_Projeto_Com_Build.zip -d extracted

      - name: Find project and build APK
        run: |
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle -type f | head -n 1)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Projeto Android não encontrado no ZIP"
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          gradle -p "$PROJECT_DIR" assembleDebug
          APK_PATH="$(find "$PROJECT_DIR" -path '*/outputs/apk/debug/app-debug.apk' -type f | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UltraBoosterMax-debug-apk
          path: app-debug.apk
